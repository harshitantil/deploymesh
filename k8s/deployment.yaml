apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudforge
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cloudforge
  template:
    metadata:
      labels:
        app: cloudforge
    spec:
      containers:
        - name: cloudforge
          image: ruchirsingh1000/cloudforge-app:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
